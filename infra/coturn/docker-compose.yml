services:
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=turn.example.com
      - --listening-port=3478
      - --tls-listening-port=5349
      - --user=tunneluser:TurnPasswordChangeMe
      - --no-stdout-log
